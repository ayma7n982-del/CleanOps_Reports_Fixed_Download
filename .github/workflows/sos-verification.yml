name: SOS verification

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

on:
  push:
    paths:
      - 'lib/**'
      - 'firebase/**'
      - 'pubspec.yaml'
      - '.github/workflows/sos-verification.yml'
  workflow_dispatch:

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select Java 17 in Flutter
        run: flutter config --jdk-dir="$JAVA_HOME"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Restore missing Android Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            wrapper_dir="$(mktemp -d)"
            touch "$wrapper_dir/build.gradle"
            gradle -p "$wrapper_dir" wrapper --gradle-version 8.14
            cp "$wrapper_dir/gradlew" ./gradlew
            mkdir -p gradle/wrapper
            cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          fi
          chmod +x gradlew
      - name: Analyze Flutter sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cleanops-sos-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
