name: Deploy Firestore rules (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-rules:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI and tests
        run: |
          npm install --no-save firebase-tools@14
          npm --prefix firebase/tests install
      - name: Verify rules in emulator before deploy
        run: npx firebase emulators:exec --project cleanops-messaging-rules-test --only firestore "npm --prefix firebase/tests test"
      - name: Publish verified Firestore rules through Firebase Rules API
        env:
          FIREBASE_PROJECT_ID: nrc-aid
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy_firestore_rules_rest.mjs
