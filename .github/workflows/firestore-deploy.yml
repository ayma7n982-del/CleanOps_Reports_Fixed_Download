name: Deploy Firestore rules (manual)
on:
  workflow_dispatch:
  # One-time repair trigger. Other future pushes cannot publish rules.
  push:
    branches: [main]
    paths:
      - '.github/workflows/firestore-deploy.yml'
permissions:
  contents: read
jobs:
  deploy-rules:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        github.event.head_commit.message == 'chore(firebase): run one-time verified Firestore rules deployment'))
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI and tests
        run: |
          npm install --no-save firebase-tools@14
          npm --prefix firebase/tests install
      - name: Verify rules in emulator before deploy
        run: npx firebase emulators:exec --project cleanops-messaging-rules-test --only firestore "npm --prefix firebase/tests test"
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules only
        run: npx firebase deploy --only firestore:rules --project nrc-aid --non-interactive
