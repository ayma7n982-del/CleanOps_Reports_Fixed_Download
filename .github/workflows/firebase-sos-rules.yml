name: Firebase SOS rules validation and controlled deployment
on:
  push:
    paths:
      - 'firebase/firestore.rules'
      - '.github/workflows/firebase-sos-rules.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy rules to nrc-aid after validation'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-sos-rules-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Validate Firestore rules syntax with emulator
        run: |
          firebase emulators:exec --project demo-cleanops --only firestore "echo Firestore rules loaded" --non-interactive

  deploy:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Firestore rules through Firebase Rules REST API
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: nrc-aid
        run: node scripts/deploy_firestore_rules_rest.mjs
