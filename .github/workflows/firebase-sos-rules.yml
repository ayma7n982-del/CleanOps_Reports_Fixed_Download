name: Firebase SOS rules validation and controlled deployment
on:
  push:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase/storage.rules'
      - 'firebase/tests/**'
      - '.github/workflows/firebase-sos-rules.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy rules to nrc-aid after validation'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-sos-rules-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install security test tools
        run: |
          npm install --no-save firebase-tools@14
          npm --prefix firebase/tests install
      - name: Verify Firestore authorization
        run: npx firebase emulators:exec --project cleanops-messaging-rules-test --only firestore "npm --prefix firebase/tests test"
      - name: Verify Storage authorization
        run: npx firebase emulators:exec --project cleanops-messaging-storage-test --only firestore,storage "npm --prefix firebase/tests run test:storage"

  deploy:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true }}
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Firestore rules through Firebase Rules REST API
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: nrc-aid
        run: node scripts/deploy_firestore_rules_rest.mjs
