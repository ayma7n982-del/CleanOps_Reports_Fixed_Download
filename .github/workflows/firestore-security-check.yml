name: Firestore security emulator

on:
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.rules'
      - 'firebase.json'
      - 'scripts/verify_firestore_rules_ci.mjs'
      - '.github/workflows/firestore-security-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21 for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing firebase
      - name: Compile rules and verify role-scoped operations access
        run: npx firebase emulators:exec --only firestore --project demo-cleanops "node scripts/verify_firestore_rules_ci.mjs"
