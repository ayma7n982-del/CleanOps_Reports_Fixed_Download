name: Decision hub release and PDF validation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}


on:
  push:
    branches: [main, feat/action-decision-hub]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/decision-hub.yml'
      - 'firebase/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free runner disk space before Android toolchain
        shell: bash
        run: |
          echo "Disk before cleanup"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          docker system prune -af || true
          sudo apt-get clean || true
          echo "Disk after cleanup"
          df -h
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Select Java 17 in Flutter
        run: flutter config --jdk-dir="$JAVA_HOME"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Restore Gradle wrapper if missing
        working-directory: android
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            wrapper_dir="$(mktemp -d)"
            touch "$wrapper_dir/build.gradle"
            gradle -p "$wrapper_dir" wrapper --gradle-version 8.14
            cp "$wrapper_dir/gradlew" ./gradlew
            mkdir -p gradle/wrapper
            cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            cp "$wrapper_dir/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          fi
          chmod +x gradlew
      - name: Check Dart compilation
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        run: flutter test
      - name: Build Android release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=false -Dkotlin.incremental=false
        run: |
          df -h
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
      - name: Show APK output locations if build failed
        if: failure()
        shell: bash
        run: |
          echo "Expected Flutter output directory:"
          ls -la build/app/outputs/flutter-apk/ || true
          echo "All generated Android APK files:"
          find build android/app/build -type f -name '*.apk' -print 2>/dev/null || true
          echo "Android Gradle output directories:"
          ls -la build/app/outputs/apk/debug/ android/app/build/outputs/apk/debug/ 2>/dev/null || true
      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanOps-Decision-Hub-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Arabic PDF report previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CleanOps-Decision-PDF-Previews
          path: build/decision-previews/*.pdf
          if-no-files-found: warn
          retention-days: 14

  decision-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator and security tests
        run: |
          npm install --no-save firebase-tools@14
          npm --prefix firebase/tests install
      - name: Verify existing permissions and decision hub rules
        run: npx firebase emulators:exec --project cleanops-messaging-rules-test --only firestore "npm --prefix firebase/tests test"

  deploy-decisions:
    if: github.ref == 'refs/heads/main'
    needs: [build-android, decision-rules]
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy and verify tested Firestore rules
        env:
          FIREBASE_PROJECT_ID: nrc-aid
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy_firestore_rules_rest.mjs
