name: Deploy required Firebase Functions to production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-functions-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-required-functions-production
  cancel-in-progress: false

jobs:
  deploy-required-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build Firebase Functions
        working-directory: functions
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Deploy cart redirect and managed user deletion
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not configured in firebase-production."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools deploy --project nrc-aid             --only functions:redirectCartAssignment,functions:deleteManagedUser             --non-interactive
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
