name: Firestore rules validation

concurrency:
  group: firestore-rules-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
on:
  push:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase/tests/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase/tests/**'
      - '.github/workflows/firestore-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase CLI and test dependencies
        run: |
          npm install --no-save firebase-tools@14
          npm --prefix firebase/tests install
      - name: Run Firestore emulator security tests
        run: npx firebase emulators:exec --project cleanops-messaging-rules-test --only firestore "npm --prefix firebase/tests test"
