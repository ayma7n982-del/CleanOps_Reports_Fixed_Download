name: Deploy and verify decision indexes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy_decision_indexes_rest.mjs'
      - '.github/workflows/decision-indexes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decision-indexes
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firebase-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check deployment script syntax
        run: node --check scripts/deploy_decision_indexes_rest.mjs
      - name: Create missing indexes and verify READY without changing IAM
        env:
          FIREBASE_PROJECT_ID: nrc-aid
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy_decision_indexes_rest.mjs
